}

.grid{

border-radius:20px;

}

a{
text-decoration:none;
color:white;
}
</style>
</head>
<body>

<h1>SELECT LEVEL</h1>

<div class="grid">
<a href="game.html?level=1"><div class="level">LEVEL 1</div></a>

<a href="game.html?level=5"><div class="level">LEVEL 5</div></a>

</html>
